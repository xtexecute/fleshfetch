name: Experimental bug report
description: Report a problem from the experimental branch or a prerelease.
title: "[Experimental Bug]: "
labels:
  - bug
  - experimental
body:
  - type: input
    id: version
    attributes:
      label: Experimental version
      placeholder: v1.3.3-exp.1 or commit hash
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Arch Linux / AUR
        - Other Linux distribution
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Tell us exactly how to make the bug happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add startup.log, console output, or screenshots if available.
